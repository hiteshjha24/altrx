version: "3.9"

services:
  # ─── PostgreSQL ───────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: altrx_db
    environment:
      POSTGRES_USER: altrx_user
      POSTGRES_PASSWORD: altrx_pass
      POSTGRES_DB: altrx_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U altrx_user -d altrx_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── FastAPI Backend ──────────────────────────────────────────────────────
  backend:
    env_file:
      - .env.local
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: altrx_api
    environment:
      DATABASE_URL: postgresql://altrx_user:altrx_pass@db:5432/altrx_db
      CORS_ORIGINS: http://localhost:3000,http://frontend:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    restart: unless-stopped

  # ─── Next.js Frontend ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: altrx_web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
